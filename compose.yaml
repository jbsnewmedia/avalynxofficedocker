name: avalynxoffice

services:
    nginx:
        image: ${NGINX_IMAGE:-nginx:1.30-alpine}
        networks:
            default:
                ipv4_address: 172.30.3.2
        ports:
            # HTTP_BIND: bind address of the published port. HTTPS mode 1 (behind an
            # external reverse proxy on the same host) → HTTP_BIND=127.0.0.1 so
            # the stack is not reachable from the outside besides the proxy.
            - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
            # Optional TLS termination in the edge (HTTPS mode 2): uncomment together
            # with the volumes below, provide the certificates and copy
            # nginx/https.conf.example + nginx/http-redirect.conf.example
            # (see README).
            # - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
        volumes:
            # Plain HTTP / HTTPS mode 1 (TLS terminated elsewhere): port-80 server
            # that proxies both applications.
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            # HTTPS mode 2 (TLS in the Compose nginx): replace the line above with
            # the port-80 redirect server and add the 443 server + certificates.
            # - ./nginx/http-redirect.conf:/etc/nginx/conf.d/default.conf:ro
            # - ./nginx/https.conf:/etc/nginx/conf.d/https/https.conf:ro
            # - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
        depends_on:
            office:
                condition: service_healthy
            eas:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        # The official image starts as root (binds :80, fixes ownership of
        # /var/cache/nginx) and drops to the nginx user for the workers.
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
            - NET_BIND_SERVICE
        deploy:
            resources:
                limits:
                    memory: ${NGINX_MEM_LIMIT:-128m}
                    pids: ${NGINX_PIDS_LIMIT:-256}
        restart: unless-stopped

    office:
        image: jbsnewmedia/avalynxoffice:${OFFICE_TAG:-latest}
        environment:
            APP_ENV: prod
            APP_DEBUG: "0"
            APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (openssl rand -hex 16)}
            AVALYNXOFFICE_ENCRYPTION_KEY: ${AVALYNXOFFICE_ENCRYPTION_KEY:?set AVALYNXOFFICE_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
            DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}?serverVersion=18&charset=utf8
            # The entrypoint grants this role the least privileges the EAS
            # service needs after every migration run.
            EAS_DB_USER: ${EAS_DB_USER:-eas_user}
            OFFICE_ADMIN_EMAIL: ${OFFICE_ADMIN_EMAIL:-admin@example.com}
            OFFICE_ADMIN_PASSWORD: ${OFFICE_ADMIN_PASSWORD:-}
            # Alternative to the plain ENV value: Compose secret (file). Set
            # the *_FILE variable, leave OFFICE_ADMIN_PASSWORD empty and
            # uncomment the `secrets:` entries here and at the top level.
            # OFFICE_ADMIN_PASSWORD_FILE: /run/secrets/office_admin_password
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.3.2}
            ATTACHMENT_STORAGE_DIR: data/attachments
            ATTACHMENT_STORAGE_SEGMENT_LENGTH: 3
            ATTACHMENT_STORAGE_SEGMENT_DEPTH: 3
            ATTACHMENT_STORAGE_MAX_BYTES: 65536
        volumes:
            - ./attachments:/app/data/attachments
            - ./office-var:/app/var
        # secrets:
        #     - office_admin_password
        healthcheck:
            # The entrypoint only exposes the web server after the database
            # bootstrap (migrations + admin user) has finished.
            test: ["CMD", "php", "-r", "exit(intval(@file_get_contents('http://127.0.0.1/') === false));"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 180s
        depends_on:
            db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        # webdevops/php-apache: Supervisor runs as root, chowns the volumes
        # and spawns Apache/PHP-FPM as the application user on port 80.
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
            - NET_BIND_SERVICE
        deploy:
            resources:
                limits:
                    memory: ${OFFICE_MEM_LIMIT:-1g}
                    pids: ${OFFICE_PIDS_LIMIT:-256}
        restart: unless-stopped

    eas:
        image: jbsnewmedia/avalynxofficeeas:${EAS_TAG:-latest}
        environment:
            # Dedicated least-privilege role (see postgres/init/01-eas-role.sh).
            DATABASE_URL: postgresql://${EAS_DB_USER:-eas_user}:${EAS_DB_PASSWORD:?set EAS_DB_PASSWORD in .env (openssl rand -hex 16)}@db:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8
            # Only requests from these addresses (the stack's fixed nginx IP)
            # may carry a trusted X-Real-IP header for the auth throttle and
            # the auth-failure log; everything else uses the socket address.
            EAS_TRUSTED_PROXIES: ${EAS_TRUSTED_PROXIES:-172.30.3.2}
            ATTACHMENT_STORAGE_DIR: data/attachments
            EAS_STATE_DIR: var/eas-state
            EAS_LOG_DIR: var/log/eas
            EAS_LOGLEVEL: ${EAS_LOGLEVEL:-1}
        volumes:
            - ./attachments:/app/data/attachments
            - ./eas-state:/app/var/eas-state
            - ./eas-log:/app/var/log/eas
        healthcheck:
            # The ActiveSync endpoint answers unauthenticated requests with
            # 401/405; any of those (or 200) proves the PHP stack is serving.
            test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/Microsoft-Server-ActiveSync); case \"$$code\" in 200|401|405) exit 0;; *) exit 1;; esac"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        depends_on:
            # The ActiveSync endpoint reads the tables created by the office
            # migrations, so it must not serve requests before the bootstrap.
            office:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        # Same base image as the office container (see above).
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
            - NET_BIND_SERVICE
        deploy:
            resources:
                limits:
                    memory: ${EAS_MEM_LIMIT:-512m}
                    pids: ${EAS_PIDS_LIMIT:-256}
        restart: unless-stopped

    db:
        image: ${POSTGRES_IMAGE:-postgres:18-alpine}
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            EAS_DB_USER: ${EAS_DB_USER:-eas_user}
            EAS_DB_PASSWORD: ${EAS_DB_PASSWORD}
        volumes:
            # /var/lib/postgresql (not .../data): PostgreSQL 18 keeps its data
            # directory below this level, which also survives major upgrades.
            - ./postgres-data:/var/lib/postgresql
            # Runs only on a fresh volume: creates the EAS role.
            - ./postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 20
        security_opt:
            - no-new-privileges:true
        # The entrypoint runs as root to initialise the data directory and
        # then switches to the postgres user via gosu.
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
        deploy:
            resources:
                limits:
                    memory: ${DB_MEM_LIMIT:-1g}
                    pids: ${DB_PIDS_LIMIT:-512}
        restart: unless-stopped

# Optional: administrator password as a Compose secret instead of an ENV value
# (see OFFICE_ADMIN_PASSWORD_FILE above). The file must contain only the
# password; `chmod 600 ./secrets/office_admin_password`.
# secrets:
#     office_admin_password:
#         file: ./secrets/office_admin_password

networks:
    default:
        ipam:
            config:
                - subnet: 172.30.3.0/24
                  # Dynamic addresses (db/office/eas) come from the upper half
                  # so the fixed nginx address 172.30.3.2 (TRUSTED_PROXIES)
                  # is never taken by a container that starts earlier.
                  ip_range: 172.30.3.128/25
