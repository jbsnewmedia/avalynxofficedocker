# Port-80 server for HTTPS mode 1 (behind an external reverse proxy) and
# plain HTTP in a trusted network. For TLS in this nginx (HTTPS mode 2) mount
# nginx/http-redirect.conf as default.conf instead (see compose.yaml / README).
server_tokens off;

# HTTPS mode 1 only (external reverse proxy in front of this nginx): the rate
# limits below key on $binary_remote_addr, which is then always the proxy
# address, and X-Real-IP/X-Forwarded-For are overwritten with it. Prefer
# pointing the external proxy directly at the office/eas containers; if this
# nginx must stay in the chain, trust the proxy address explicitly:
#   set_real_ip_from 127.0.0.1;      # address of the external proxy
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
# and add the external proxy to TRUSTED_PROXIES of the office container.

# Brute-force protection for the web login: 30 requests per minute and IP
# (a short burst is queued, everything beyond that gets 429).
limit_req_zone $binary_remote_addr zone=office_login:10m rate=30r/m;
limit_req_status 429;
# ActiveSync clients poll frequently and keep long Ping requests open, so no
# request-rate limit here - only cap the concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=eas_conn:10m;
limit_conn_status 429;

server {
    listen 80;
    # Recommended: set your real host name (e.g. office.example.com) instead
    # of the catch-all and use it in the redirect below, so that arbitrary
    # Host headers are not echoed into the Location header.
    server_name _;

    client_max_body_size 64m;

    # ActiveSync uses Basic authentication, so never forward it over HTTP.
    # $host is the portable default; with a fixed server_name prefer
    # `return 308 https://office.example.com$request_uri;`.
    location /Microsoft-Server-ActiveSync {
        limit_conn eas_conn 20;
        return 308 https://$host$request_uri;
    }

    location = /login {
        limit_req zone=office_login burst=10 nodelay;
        proxy_pass http://office:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> AvalynxOffice web client.
    location / {
        proxy_pass http://office:80;
        # $http_host (not $host) keeps a non-standard host port (e.g. :8090)
        # so the app generates correct absolute URLs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional TLS server block: nginx/https.conf is mounted into
# /etc/nginx/conf.d/https/ via compose when HTTPS termination in the edge is
# enabled. A glob include that matches nothing is not an error, so the stack
# also runs without it (HTTP only / behind an external reverse proxy).
# Note: with TLS enabled this file should be replaced by http-redirect.conf
# (full HTTP->HTTPS redirect); the include is kept so that a forgotten switch
# still results in a working HTTPS server.
include /etc/nginx/conf.d/https/*.conf;
